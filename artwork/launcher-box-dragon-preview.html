<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LongTV Launcher Concepts</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08111f;
      color: #f7f9fc;
      padding: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 18px;
    }
    img {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 24px;
      background: #050b14;
    }
    h2 {
      font-size: 18px;
      margin: 14px 0 6px;
    }
    p {
      margin: 0;
      color: #b4c0d3;
      line-height: 1.5;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <img src="./launcher-box-dragon-v1.svg" alt="v1">
      <h2>V1 影盒徽章</h2>
      <p>方盒轮廓最强，右侧龙身包住播放符号，整体最像影视 App 主图标。</p>
    </div>
    <div class="card">
      <img src="./launcher-box-dragon-v2.svg" alt="v2">
      <h2>V2 盘龙印章</h2>
      <p>龙形更抽象，像印章或图腾，识别度更品牌化，也更适合做 launcher。</p>
    </div>
    <div class="card">
      <img src="./launcher-box-dragon-v3.svg" alt="v3">
      <h2>V3 几何机甲龙</h2>
      <p>线条最硬朗，科技感更强，适合偏 TV 盒子和影音设备的气质。</p>
    </div>
  </div>
</body>
</html>
